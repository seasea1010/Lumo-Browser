# Lumo Windows build — Helium-style iterative build.
#
# GitHub Actions kills a job after 6 hours, but a Chromium full build
# takes 10+ hours, so the build is split into 15 sequential stages
# (build-1 .. build-15), each a call to the reusable workflow
# build-stage.yml. Each stage runs scripts/ci/stage.py, which resumes
# from the previous stage's build-state artifact and checkpoints the
# whole build tree (C:/lumo-build) when its time budget expires.
# A stage exits 42 when the budget expires (resume in the next stage);
# exit 0 means the build finished.
#
# Cross-run resume: ONLY the entry stage (inputs.resume-stage) may
# download its checkpoint from the earlier run (resume-run-id);
# every later stage must chain from THIS run's own checkpoints.
# Each build-N therefore passes run-id conditionally:
#   run-id: ${{ inputs.resume-stage == N && inputs.resume-run-id || '' }}
# ('' makes build-stage.yml fall back to github.run_id.)
# History: #21 failed in build-4 because only build-5 passed run-id,
# so build-4 looked for lumo-build-state-3 in its own run. Passing
# resume-run-id to ALL stages unconditionally (the #21 fix) then
# broke #22 in build-5, which looked for lumo-build-state-4 in the
# old run instead of its own. The conditional above is the correct
# general form.
#
# Lumo build number (task 6 extension): every build-N also passes
# build-number = this run's github.run_number. stage.py embeds it
# in the generated lumo_build_config.h during setup, and the
# browser compares it against the per-profile record to show the
# welcome flow once after an upgrade (the product version string
# is identical across builds, so it cannot key that decision).
# The header is generated only in the setup phase, so a cross-run
# resume chain keeps the ORIGINAL run's number; run numbers grow
# monotonically, so a shipped resume build still sorts after every
# earlier build. Unlike run-id, build-number is passed
# unconditionally: later stages never regenerate the header, so
# their value is simply unused.
#
# When some stage finishes, build-final downloads that stage's
# build-state artifact, packages the portable build as
# lumo-windows-x64.zip and uploads it as an artifact.
#
# NO RELEASE IS CREATED. Lumo is proprietary and must not be handed to
# anyone else while the repository is public (see LICENSE.md). The zip
# is only available as a workflow artifact, for seasea1010 to download.
# The old publish-release job and the tag trigger were removed for
# this reason; the workflow runs only on manual dispatch.
#
# Build profile: AVX2 only (target machine: Intel Core i5-8350U, AVX2
# confirmed). No SSE3 build is produced. The Thorium patches build
# thorium.exe; build-final renames it to lumo.exe in the package.
#
# Status: the stage chain ran end to end in run #12 (2026-11-15)
# and the build completed in build-4. build-final failed in #12 on
# disk space (it extracted the whole ~20.7 GiB tree next to the
# ~10 GB checkpoint zip) and was rewritten afterwards to extract
# only out/thorium and prune the build-only files; the rewritten
# build-final has not run in CI yet. See scripts/ci/stage.py.
#
# Build-failure notification (task 47): the notify-failure job at
# the end of this file POSTs a signed notice to a Cloudflare Worker
# whenever any build stage or build-final fails, so Muse learns
# about a failure immediately instead of waiting for a status check.
# It is best-effort: it always exits 0, never changes the build
# result, and is skipped when the LUMO_BUILD_NOTIFY_KEY secret is
# not registered.
name: Build Lumo for Windows

on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: Runner image name
        default: windows-2025
      resume-run-id:
        required: false
        description: 'Resume from this run id (e.g. 44018615694 for #17 state-4). Empty = fresh build.'
        default: ''
      resume-stage:
        required: false
        description: 'Stage to resume at (e.g. 5 for state-4). 0 = fresh build.'
        type: number
        default: 0

permissions:
  contents: read
  actions: read

jobs:
  build-1:
    if: ${{ inputs.resume-stage == 0 }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 1
      from-artifact: false
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 1 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-2:
    needs: build-1
    if: ${{ !cancelled() && !failure() && (needs.build-1.outputs.finished == 'false' || inputs.resume-stage == 2) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 2
      from-artifact: true
      artifact-name: lumo-build-state-1
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 2 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-3:
    needs: build-2
    if: ${{ !cancelled() && !failure() && (needs.build-2.outputs.finished == 'false' || inputs.resume-stage == 3) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 3
      from-artifact: true
      artifact-name: lumo-build-state-2
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 3 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-4:
    needs: build-3
    if: ${{ !cancelled() && !failure() && (needs.build-3.outputs.finished == 'false' || inputs.resume-stage == 4) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 4
      from-artifact: true
      artifact-name: lumo-build-state-3
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 4 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-5:
    needs: build-4
    if: ${{ !cancelled() && !failure() && (needs.build-4.outputs.finished == 'false' || inputs.resume-stage == 5) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 5
      from-artifact: true
      artifact-name: lumo-build-state-4
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 5 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-6:
    needs: build-5
    if: ${{ !cancelled() && !failure() && (needs.build-5.outputs.finished == 'false' || inputs.resume-stage == 6) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 6
      from-artifact: true
      artifact-name: lumo-build-state-5
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 6 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-7:
    needs: build-6
    if: ${{ !cancelled() && !failure() && (needs.build-6.outputs.finished == 'false' || inputs.resume-stage == 7) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 7
      from-artifact: true
      artifact-name: lumo-build-state-6
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 7 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-8:
    needs: build-7
    if: ${{ !cancelled() && !failure() && (needs.build-7.outputs.finished == 'false' || inputs.resume-stage == 8) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 8
      from-artifact: true
      artifact-name: lumo-build-state-7
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 8 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-9:
    needs: build-8
    if: ${{ !cancelled() && !failure() && (needs.build-8.outputs.finished == 'false' || inputs.resume-stage == 9) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 9
      from-artifact: true
      artifact-name: lumo-build-state-8
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 9 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-10:
    needs: build-9
    if: ${{ !cancelled() && !failure() && (needs.build-9.outputs.finished == 'false' || inputs.resume-stage == 10) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 10
      from-artifact: true
      artifact-name: lumo-build-state-9
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 10 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-11:
    needs: build-10
    if: ${{ !cancelled() && !failure() && (needs.build-10.outputs.finished == 'false' || inputs.resume-stage == 11) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 11
      from-artifact: true
      artifact-name: lumo-build-state-10
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 11 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-12:
    needs: build-11
    if: ${{ !cancelled() && !failure() && (needs.build-11.outputs.finished == 'false' || inputs.resume-stage == 12) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 12
      from-artifact: true
      artifact-name: lumo-build-state-11
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 12 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-13:
    needs: build-12
    if: ${{ !cancelled() && !failure() && (needs.build-12.outputs.finished == 'false' || inputs.resume-stage == 13) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 13
      from-artifact: true
      artifact-name: lumo-build-state-12
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 13 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-14:
    needs: build-13
    if: ${{ !cancelled() && !failure() && (needs.build-13.outputs.finished == 'false' || inputs.resume-stage == 14) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 14
      from-artifact: true
      artifact-name: lumo-build-state-13
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 14 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-15:
    needs: build-14
    if: ${{ !cancelled() && !failure() && (needs.build-14.outputs.finished == 'false' || inputs.resume-stage == 15) }}
    uses: ./.github/workflows/build-stage.yml
    secrets: inherit
    with:
      stage: 15
      from-artifact: true
      artifact-name: lumo-build-state-14
      runner: ${{ inputs.runner || 'windows-2025' }}
      run-id: ${{ inputs.resume-stage == 15 && inputs.resume-run-id || '' }}
      build-number: ${{ github.run_number }}

  build-final:
    name: Package Lumo
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 330
    env:
      STAGE_1_RESULT: ${{ needs.build-1.result }}
      STAGE_1_FINISHED: ${{ needs.build-1.outputs.finished }}
      STAGE_2_RESULT: ${{ needs.build-2.result }}
      STAGE_2_FINISHED: ${{ needs.build-2.outputs.finished }}
      STAGE_3_RESULT: ${{ needs.build-3.result }}
      STAGE_3_FINISHED: ${{ needs.build-3.outputs.finished }}
      STAGE_4_RESULT: ${{ needs.build-4.result }}
      STAGE_4_FINISHED: ${{ needs.build-4.outputs.finished }}
      STAGE_5_RESULT: ${{ needs.build-5.result }}
      STAGE_5_FINISHED: ${{ needs.build-5.outputs.finished }}
      STAGE_6_RESULT: ${{ needs.build-6.result }}
      STAGE_6_FINISHED: ${{ needs.build-6.outputs.finished }}
      STAGE_7_RESULT: ${{ needs.build-7.result }}
      STAGE_7_FINISHED: ${{ needs.build-7.outputs.finished }}
      STAGE_8_RESULT: ${{ needs.build-8.result }}
      STAGE_8_FINISHED: ${{ needs.build-8.outputs.finished }}
      STAGE_9_RESULT: ${{ needs.build-9.result }}
      STAGE_9_FINISHED: ${{ needs.build-9.outputs.finished }}
      STAGE_10_RESULT: ${{ needs.build-10.result }}
      STAGE_10_FINISHED: ${{ needs.build-10.outputs.finished }}
      STAGE_11_RESULT: ${{ needs.build-11.result }}
      STAGE_11_FINISHED: ${{ needs.build-11.outputs.finished }}
      STAGE_12_RESULT: ${{ needs.build-12.result }}
      STAGE_12_FINISHED: ${{ needs.build-12.outputs.finished }}
      STAGE_13_RESULT: ${{ needs.build-13.result }}
      STAGE_13_FINISHED: ${{ needs.build-13.outputs.finished }}
      STAGE_14_RESULT: ${{ needs.build-14.result }}
      STAGE_14_FINISHED: ${{ needs.build-14.outputs.finished }}
      STAGE_15_RESULT: ${{ needs.build-15.result }}
      STAGE_15_FINISHED: ${{ needs.build-15.outputs.finished }}
    steps:
      - uses: actions/checkout@v5

      - name: Find the stage that finished the build
        id: last
        shell: pwsh
        run: |
          $lastStage = 0
          $finished = 'false'
          foreach ($n in 15..1) {
            $result = [System.Environment]::GetEnvironmentVariable("STAGE_${n}_RESULT")
            if ($result -eq 'success') {
              $lastStage = $n
              $finished = [System.Environment]::GetEnvironmentVariable("STAGE_${n}_FINISHED")
              break
            }
          }
          if ($lastStage -eq 0) { throw 'No build stage ran successfully.' }
          if ($finished -ne 'true') {
            throw "Build did not finish within 15 stages (last ran stage: $lastStage). A new workflow run starts over from stage 1 — it cannot resume from this run's checkpoints (build-state artifacts are only chained inside a single run). Investigate why the build outgrew 15 stages before re-running."
          }
          "stage=$lastStage" >> $env:GITHUB_OUTPUT
          Write-Host "Build finished in stage $lastStage; packaging its build-state artifact."

      - name: Free disk space for packaging
        shell: pwsh
        run: |
          # Run #12's Package Lumo died of a full disk: the usable
          # space on these runners is small and this job downloads a
          # ~10 GB checkpoint zip. Show the starting point, remove
          # large preinstalled tooling this job never uses (exact
          # paths only, each guarded and non-fatal — the same
          # allowlist philosophy as stage.py's free_disk_space),
          # then show what it bought. The extraction below targets
          # C:, so C: is the drive that matters most.
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7z is not available on this runner'
          }
          Write-Host 'Free space before cleanup:'
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGiB';e={[math]::Round($_.Free / 1GB, 1)}} |
            Format-Table -AutoSize
          $candidates = @(
            'C:\Android\android-sdk',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet',
            'C:\hostedtoolcache',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\Microsoft SQL Server'
          )
          foreach ($p in $candidates) {
            if (Test-Path $p) {
              Write-Host "Removing unused preinstalled tooling: $p"
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host 'Free space after cleanup:'
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGiB';e={[math]::Round($_.Free / 1GB, 1)}} |
            Format-Table -AutoSize

      - name: Download finished build state
        uses: actions/download-artifact@v7
        with:
          name: lumo-build-state-${{ steps.last.outputs.stage }}
          path: build-state

      - name: Check disk space before extraction
        shell: pwsh
        run: |
          $zip = Get-Item 'build-state\build-state.zip'
          Write-Host "Checkpoint zip: $($zip.Name), $([math]::Round($zip.Length / 1GB, 2)) GiB"
          7z l $zip.FullName | Select-Object -Last 4
          # Integrity gate: verify every entry's CRC before
          # packaging from this tree, so a checkpoint corrupted in
          # upload/storage/download cannot quietly put a broken
          # DLL into the shipped zip. Exit 1 is a warning only;
          # exit >= 2 is fatal.
          7z t $zip.FullName
          if ($LASTEXITCODE -ge 2) { throw "Checkpoint integrity check failed (7z t exit $LASTEXITCODE): the checkpoint zip is corrupt or truncated; refusing to package from it." }
          if ($LASTEXITCODE -eq 1) { Write-Host 'WARNING: 7z t exited 1 (warnings only); continuing.' }
          $freeC = (Get-PSDrive C).Free / 1GB
          $wsDrive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
          $freeWs = (Get-PSDrive $wsDrive).Free / 1GB
          Write-Host "Free space: C: $([math]::Round($freeC, 1)) GiB, workspace drive ${wsDrive}: $([math]::Round($freeWs, 1)) GiB"
          # The selective extraction below writes only the pruned
          # browser tree (~4 GiB for run #12's tree) to C:, but if
          # the 7z exclusion patterns ever miss, the raw out/thorium
          # subtree is ~15 GiB. Fail early and clearly instead of
          # dying halfway through the extraction like run #12 did.
          if ($freeC -lt 10) {
            throw "Not enough free space on C: for packaging: $([math]::Round($freeC, 1)) GiB free, need at least 10 GiB (the browser tree is extracted to C:\lumo-package)."
          }

      - name: Extract only the browser tree (out/thorium)
        shell: pwsh
        run: |
          # NEVER extract the whole checkpoint like the old step
          # did (`7z x build-state.zip -oC:\`): the full tree is
          # ~20.7 GiB / 888k files, and holding it next to the
          # ~10 GB zip is what filled the disk in run #12. Extract
          # only lumo-build/src/out/thorium, excluding the
          # build-only bulk (obj/, gen/, toolchains, intermediates,
          # build-tool caches) already at extraction time. The
          # prune step below then guarantees the exact package
          # contents even if one of these patterns misses.
          $tree = 'lumo-build/src/out/thorium'
          $excludeDirs = @(
            'obj', 'gen', 'toolchain',
            'win_clang_x64_for_rust_host_build_tools',
            'win_clang_x64_host_with_system_allocator',
            'win_clang_x64_with_system_allocator',
            'local_rustc_sysroot', 'test_fonts', 'pyproto', 'jsproto',
            'ui', 'signing', 'initialexe'
          )
          $excludeFiles = @(
            '*.ninja', '*.ninja_log', '*.ninja_deps', '*.lib', '*.exp',
            '*.ilk', '*.pdb', '*.stamp', '*.rsp', '*.o', '*.obj',
            '*.a', '*.d', '*mini_installer.exe', '*.runtime_deps',
            '*_generator.exe', 'siso*', '.siso*'
          )
          $xargs = @('x', 'build-state\build-state.zip', '-oC:\lumo-package', '-y', "$tree/*")
          foreach ($d in $excludeDirs) { $xargs += "-x!$tree/$d/*" }
          foreach ($f in $excludeFiles) { $xargs += "-x!$f" }
          & 7z @xargs
          if ($LASTEXITCODE -ge 2) { throw "7z selective extraction failed: $LASTEXITCODE" }
          if ($LASTEXITCODE -eq 1) { Write-Host 'WARNING: 7z exited 1 (some files could not be extracted); the package verification below decides whether the tree is usable.' }
          $exe = 'C:\lumo-package\lumo-build\src\out\thorium\thorium.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'thorium.exe not found after selective extraction; top of the archive listing:'
            7z l build-state\build-state.zip | Select-Object -First 40
            throw "Built binary not found: $exe"
          }
          Get-Item $exe | Select-Object Name, Length | Format-List
          # The ~10 GB checkpoint zip is no longer needed; free the
          # workspace drive before the final zip is written there.
          Remove-Item 'build-state' -Recurse -Force
          Write-Host 'Free space after extraction and checkpoint deletion:'
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGiB';e={[math]::Round($_.Free / 1GB, 1)}} |
            Format-Table -AutoSize

      - name: Prune build-only files from the tree
        shell: pwsh
        run: |
          # Mirror the salvage packaging that produced the zip
          # seasea1010 verified by launching lumo.exe on 2026-11-15
          # (lumo-salvage/extract_dist.py + make_package.py, run
          # against the same run #12 checkpoint: 552 files,
          # 641,938,482 bytes unpacked). Deliberate differences
          # from the salvage: setup.exe and setup.ex_ are also
          # dropped (they are Chromium's installer binaries — the
          # portable package runs lumo.exe directly, and an
          # accidental setup.exe run would try to install the
          # build AS Thorium and fight the user's existing Thorium
          # install/profile), and the pruning happens in place
          # instead of via a robocopy copy (a copy would double
          # the tree's disk footprint for no benefit).
          $outDir = 'C:\lumo-package\lumo-build\src\out\thorium'
          # Top-level directories that are build tooling, not the
          # browser (salvage DROP_DIRS, which include the old
          # workflow's obj/gen/toolchain).
          $dropDirs = @(
            'obj', 'gen', 'toolchain',
            'win_clang_x64_for_rust_host_build_tools',
            'win_clang_x64_host_with_system_allocator',
            'win_clang_x64_with_system_allocator',
            'local_rustc_sysroot', 'test_fonts', 'pyproto', 'jsproto',
            'ui', 'signing', 'initialexe'
          )
          foreach ($d in $dropDirs) {
            $p = Join-Path $outDir $d
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          # Intermediate/build files at ANY depth (salvage
          # extract_dist.py's pattern list, matched on the name).
          $intermediates = @(
            '*.ninja', '*.ninja_log', '*.ninja_deps', '*.lib', '*.exp',
            '*.ilk', '*.pdb', '*.stamp', '*.rsp', '*.o', '*.obj',
            '*.a', '*.d', '*mini_installer.exe'
          )
          Get-ChildItem $outDir -Recurse -File | Where-Object {
            $name = $_.Name
            $hit = $false
            foreach ($pat in $intermediates) { if ($name -like $pat) { $hit = $true; break } }
            $hit
          } | Remove-Item -Force
          # Top-level files that are tools/caches, not the browser
          # (salvage make_package.py's DROP_FILES + its prefix/
          # suffix rules, plus setup.exe / setup.ex_ — see above).
          $dropFiles = @(
            'chrome.7z', 'chrome.packed.7z', 'policy_templates.zip',
            'thorium_shell.exe', 'chromedriver.exe',
            'LICENSE.chromedriver', 'THIRD_PARTY_NOTICES.chromedriver',
            'content_shell.pak', 'content_shell.pak.info',
            'shell_resources.pak',
            'thorium-shell', 'thorium-shell.desktop',
            'thorium_shell.ico', 'thorium_shell.png',
            # Thorium's own icon/logo artwork, copied into the
            # build output by Thorium's setup: seasea1010 found
            # both in the run #23 zip and asked for them out
            # (2026-11-20, task 22). The exe's icon is embedded,
            # so these are inert leftovers. A survey of the
            # salvage package's 552 files found no other
            # Thorium-named files beyond these and the shell
            # companions above.
            'thorium.ico', 'thorium.svg',
            'headless_shell.exe',
            'VkLayer_khronos_validation.dll',
            'VkICD_mock_icd.dll', 'test_trace_processor.dll',
            'protoc.exe', 'protoc-gen-js.exe', 'protozero_plugin.exe',
            'protozero_descriptor_diff.exe', 'proto_extras_plugin.exe',
            'flatc.exe', 'torque.exe', 'nasm.exe', 'clang-tblgen.exe',
            'llvm-tblgen.exe', 'cppgen_plugin.exe',
            'gen-regexp-special-case.exe', 'brotli.exe',
            'pak_mingw32.exe', 'pak_mingw64.exe',
            'make_top_domain_list_variables.exe',
            'generate_colors_info.exe', 'signer_set_tool.exe',
            'root_store_tool.exe', 'mksnapshot.exe',
            'setup.exe', 'setup.ex_',
            'args.gn', '.gitignore', '.thorium-setup-files.json',
            'README.md', 'Logo.png', 'SmallLogo.png'
          )
          Get-ChildItem $outDir -File | Where-Object {
            $name = $_.Name
            ($dropFiles -contains $name) -or
            $name.StartsWith('siso') -or $name.StartsWith('.siso') -or
            $name.EndsWith('.runtime_deps') -or
            $name.EndsWith('_generator.exe') -or
            # Thorium Shell / content_shell companions: the shell
            # is a separate developer app, not part of Lumo, and
            # seasea1010 asked for its files to never ship in the
            # portable zip (2026-11-15). thorium_shell.exe and
            # content_shell.pak are in $dropFiles above; these
            # patterns cover the rest (icons, launchers, paks).
            $name -like 'thorium_shell*' -or
            $name -like 'thorium-shell*' -or
            $name -like 'content_shell*' -or
            $name -like 'headless_shell*'
          } | Remove-Item -Force
          # Fail loudly if any shell file survived the prune, so a
          # future build cannot silently ship them again.
          $shellLeft = Get-ChildItem $outDir -File | Where-Object { $_.Name -like '*shell*' }
          if ($shellLeft) { throw "Thorium Shell files still present after prune: $($shellLeft.Name -join ', ')" }
          $files = Get-ChildItem $outDir -Recurse -File
          $bytes = ($files | Measure-Object Length -Sum).Sum
          Write-Host "Pruned tree: $($files.Count) files, $bytes bytes (salvage reference: 552 files / 641938482 bytes, minus setup.exe, setup.ex_ and the Thorium Shell companion files)."

      - name: Rename thorium.exe to lumo.exe
        shell: pwsh
        run: |
          $outDir = 'C:\lumo-package\lumo-build\src\out\thorium'
          $exe = Join-Path $outDir 'thorium.exe'
          if (-not (Test-Path $exe)) { throw "Built binary not found: $exe" }
          # Thorium's patches name the binary thorium.exe; the
          # portable package ships it as lumo.exe. The rename is
          # VERIFIED: the run #12 salvage package with this rename
          # launched on seasea1010's Windows PC (2026-11-15). The
          # mini installer is NOT included, and setup.exe is
          # pruned above: both would install the product as
          # Thorium until Lumo rebranding patches exist (see
          # PLAN.md).
          Rename-Item $exe 'lumo.exe'
          if (-not (Test-Path (Join-Path $outDir 'lumo.exe'))) { throw 'lumo.exe missing after rename' }
          if (Test-Path (Join-Path $outDir 'thorium.exe')) { throw 'thorium.exe still present after rename' }

      - name: Sign lumo.exe (self-signed certificate)
        shell: pwsh
        env:
          LUMO_SIGN_PFX_BASE64: ${{ secrets.LUMO_SIGN_PFX_BASE64 }}
          LUMO_SIGN_PASSWORD: ${{ secrets.LUMO_SIGN_PASSWORD }}
        run: |
          # Self-signing (task 18, decided by the owner on
          # 2026-11-18): sign the renamed lumo.exe — and only
          # lumo.exe — with a self-signed code signing
          # certificate whose subject is seasea1019 (the signing
          # identity is 1019 on purpose; every other name in
          # Lumo stays seasea1010), delivered via GitHub Secrets as a
          # base64-encoded PFX plus its password. A self-signed
          # certificate is not trusted by Windows, so this does
          # not silence SmartScreen; the point is the signer name
          # on the file and tamper evidence, which is enough for
          # a browser only seasea1010 runs. The PFX is restored
          # to a temp file, used once, and always deleted in the
          # finally block; neither the password nor the PFX
          # contents are ever echoed.
          # Migration safety: while the secrets are not
          # registered yet, skip signing with a warning instead
          # of failing the whole packaging job.
          if ([string]::IsNullOrWhiteSpace($env:LUMO_SIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:LUMO_SIGN_PASSWORD)) {
            Write-Host '::warning::LUMO_SIGN_PFX_BASE64 / LUMO_SIGN_PASSWORD secrets are not set; packaging lumo.exe UNSIGNED.'
            return
          }
          $exePath = 'C:\lumo-package\lumo-build\src\out\thorium\lumo.exe'
          if (-not (Test-Path $exePath)) { throw "lumo.exe not found for signing: $exePath" }
          # Locate signtool in whatever Windows SDK version the
          # runner carries (do not pin a version): newest
          # versioned bin directory wins.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found under C:\Program Files (x86)\Windows Kits\10\bin\*\x64' }
          Write-Host "Using signtool: $($signtool.FullName)"
          $pfxPath = Join-Path $env:RUNNER_TEMP 'lumo-sign.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:LUMO_SIGN_PFX_BASE64))
            & $signtool.FullName sign /f $pfxPath /p $env:LUMO_SIGN_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /v $exePath
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed (exit $LASTEXITCODE)" }
          } finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }
          # Verify a signature is actually present and names
          # seasea1019. A self-signed certificate makes the
          # Authenticode Status a trust error (UnknownError /
          # NotTrusted): expected, and NOT a failure. Only a
          # missing signature or a signer that is not seasea1019
          # (wrong secret registered) fails the job.
          $sig = Get-AuthenticodeSignature $exePath
          if (-not $sig.SignerCertificate) { throw 'lumo.exe has no Authenticode signature after signing.' }
          Write-Host "Signature present. Status: $($sig.Status). Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.SignerCertificate.Subject -notmatch 'seasea1019') {
            throw "Unexpected signer certificate subject: $($sig.SignerCertificate.Subject)"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $outDir = 'C:\lumo-package\lumo-build\src\out\thorium'
          @'
          Lumo — pre-release portable build (AVX2, Windows x64).
          Built from a Thorium-style Chromium fork (Chromium 156).
          Proprietary software, Copyright (c) 2026 seasea1010.
          All rights reserved. Do not use, copy, or redistribute.
          See LICENSE.md in the Lumo-Browser repository.

          Bundled extensions (each under its own license):
          uBlock Origin and uBlock Origin Scope, by Raymond Hill
          (gorhill) and contributors, licensed under the GNU General
          Public License v3 (GPLv3). Sources:
          https://github.com/gorhill/uBlock
          https://github.com/gorhill/uBO-Scope
          '@ | Set-Content -Path (Join-Path $outDir 'README-LUMO.txt') -Encoding UTF8
          if (-not (Test-Path (Join-Path $outDir 'lumo.exe'))) { throw 'lumo.exe missing after rename' }
          if (Test-Path (Join-Path $outDir 'thorium.exe')) { throw 'thorium.exe still present after rename' }
          if (Test-Path (Join-Path $outDir 'setup.exe')) { throw 'setup.exe still present after prune' }
          # Core runtime files (the salvage package's assertions):
          # the browser cannot start without these. The locales
          # entry doubles as a canary that the extraction really
          # recursed into subdirectories.
          $core = @(
            'lumo.exe', 'chrome.dll', 'chrome_elf.dll', 'icudtl.dat',
            'resources.pak', 'chrome_100_percent.pak',
            'chrome_200_percent.pak', 'snapshot_blob.bin',
            'v8_context_snapshot.bin', 'libEGL.dll', 'libGLESv2.dll',
            'locales\en-US.pak'
          )
          $missing = $core | Where-Object { -not (Test-Path (Join-Path $outDir $_)) }
          if ($missing) { throw "Core runtime files missing from the extracted tree: $($missing -join ', ')" }
          7z a -tzip lumo-windows-x64.zip "$outDir\*" -mx=3 -mtc=on
          if ($LASTEXITCODE -ne 0) { throw "7z packaging failed: $LASTEXITCODE" }
          Get-Item lumo-windows-x64.zip | Select-Object Name, Length | Format-List

      - name: Upload portable package
        uses: actions/upload-artifact@v6
        with:
          name: lumo-windows-x64
          path: lumo-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  notify-failure:
    name: Notify build failure
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15, build-final]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify build failure
        shell: bash
        env:
          NOTIFY_KEY: ${{ secrets.LUMO_BUILD_NOTIFY_KEY }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set +e
          if [ -z "$NOTIFY_KEY" ]; then
            echo "LUMO_BUILD_NOTIFY_KEY not set; skipping build-failure notification."
            exit 0
          fi
          TS=$(date +%s)
          FAILED=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(",")')
          MSG="${GITHUB_REPOSITORY}.${GITHUB_RUN_ID}.${TS}"
          SIG=$(printf '%s' "$MSG" | openssl dgst -sha256 -hmac "$NOTIFY_KEY" | awk '{print $NF}')
          BODY=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_number "$GITHUB_RUN_NUMBER" \
            --arg failed "$FAILED" \
            --arg head_sha "$GITHUB_SHA" \
            --argjson ts "$TS" \
            --arg sig "$SIG" \
            '{repo: $repo, workflow: $workflow, run_id: $run_id, run_number: $run_number, conclusion: "failure", failed_jobs: ($failed | split(",") | map(select(length > 0))), head_sha: $head_sha, ts: $ts, sig: $sig}')
          curl --silent --max-time 30 -A "Mozilla/5.0" -H 'content-type: application/json' -d "$BODY" https://lumo-build-notify.l-quiet-relay3813.workers.dev/notify || true
          exit 0
