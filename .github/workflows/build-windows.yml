# DRAFT — UNTESTED. Do not assume this workflow runs.
#
# Lumo Windows build, Helium-style iterative build.
# Mirrors imputnet/helium-windows (.github/workflows/build-steps.yml +
# build-stage.yml + .github/actions/stage/index.js):
#   * GitHub Actions kills a job after 6 hours. A Chromium full build
#     takes 10+ hours, so the build is split into 15 sequential jobs.
#   * build-1 starts fresh (from_artifact: false). Each later job runs
#     only while the previous job reports finished == 'false', downloads
#     the previous job's build-state artifact, and resumes from it.
#   * The stage script exits 42 when the time budget expires with the
#     build incomplete (Helium's convention) — that is NOT a failure,
#     it just means "resume in the next job".
#   * When a stage finishes the build, build-final packages lumo.exe
#     and publish-release creates a GitHub Release on tag v*.
#   * Build state is zipped (7z) and passed as an artifact. GitHub
#     Artifacts have size/retention limits — if the state zip is too
#     big this will fail, and sccache / a larger runner will be needed.
#   * Google API keys are NEVER in this file. They come from Secrets
#     (GOOGLE_API_KEY / GOOGLE_DEFAULT_CLIENT_ID /
#     GOOGLE_DEFAULT_CLIENT_SECRET) and are injected into args.gn at
#     build time only.
name: Build Lumo for Windows (DRAFT)

on:
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: Runner image name
        default: windows-2025
      do-release:
        required: false
        type: boolean
        description: Create a release after the build is done
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ARTIFACT_NAME: build-artifact-x64
  BUILD_STATE_ZIP: build-state.zip

jobs:
  build-1:
    name: Build stage 1 of 15
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 330
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run build stage
        id: stage
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: |
          # TODO: fetch Chromium + apply Thorium patches on stage 1,
          # then run scripts/ci/stage.py. Exit 42 = incomplete, resume.
          python3 scripts/ci/stage.py --chromium-src C:/lumo-build/src --out-dir out/lumo || code=$?
          code=${code:-0}
          if [ "$code" -eq 0 ]; then echo "finished=true" >> "$GITHUB_OUTPUT";
          elif [ "$code" -eq 42 ]; then echo "finished=false" >> "$GITHUB_OUTPUT";
          else echo "finished=false" >> "$GITHUB_OUTPUT"; exit "$code"; fi
      - name: Upload build state for the next stage
        if: steps.stage.outputs.finished == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_STATE_ZIP }}
          retention-days: 3

  build-2:
    name: Build stage 2 of 15
    needs: build-1
    if: needs.build-1.outputs.finished == 'false'
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 330
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download previous build state
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build-state
      - name: Extract previous build state
        shell: pwsh
        run: 7z x build-state/${{ env.BUILD_STATE_ZIP }} -oC:\lumo-build
      - name: Run build stage
        id: stage
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
