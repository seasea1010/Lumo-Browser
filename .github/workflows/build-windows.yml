          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: |
          python3 scripts/ci/stage.py --chromium-src C:/lumo-build/src --out-dir out/lumo || code=$?
          code=${code:-0}
          if [ "$code" -eq 0 ]; then echo "finished=true" >> "$GITHUB_OUTPUT";
          elif [ "$code" -eq 42 ]; then echo "finished=false" >> "$GITHUB_OUTPUT";
          else echo "finished=false" >> "$GITHUB_OUTPUT"; exit "$code"; fi
      - name: Upload build state for the next stage
        if: steps.stage.outputs.finished == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_STATE_ZIP }}
          retention-days: 3

  build-15:
    name: Build stage 15 of 15
    needs: build-14
    if: needs.build-14.outputs.finished == 'false'
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 330
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download previous build state
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build-state
      - name: Extract previous build state
        shell: pwsh
        run: 7z x build-state/${{ env.BUILD_STATE_ZIP }} -oC:\lumo-build
      - name: Run build stage
        id: stage
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: |
          python3 scripts/ci/stage.py --chromium-src C:/lumo-build/src --out-dir out/lumo || code=$?
          code=${code:-0}
          if [ "$code" -eq 0 ]; then echo "finished=true" >> "$GITHUB_OUTPUT";
          elif [ "$code" -eq 42 ]; then echo "finished=false" >> "$GITHUB_OUTPUT";
          else echo "finished=false" >> "$GITHUB_OUTPUT"; exit "$code"; fi
      - name: Upload build state for the next stage
        if: steps.stage.outputs.finished == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_STATE_ZIP }}
          retention-days: 3

  build-final:
    name: Package Lumo
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Download finished build state
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build-state
      - name: Package portable zip (TODO)
        shell: pwsh
        run: |
          # TODO: collect out/lumo/lumo.exe + required DLLs, .pak files,
          # locales and resources into dist/, then zip as lumo-windows-x64.zip.
          # This step is a placeholder until the first successful build exists.
          Write-Host 'TODO: package lumo.exe'
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: lumo-windows-x64
          path: lumo-windows-x64.zip
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-final
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.do-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: lumo-windows-x64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/lumo-windows-x64.zip \
            --title "Lumo ${{ github.ref_name }}" \
            --notes "DRAFT release — built from a Thorium-style Chromium fork. See PLAN.md for known risks."
