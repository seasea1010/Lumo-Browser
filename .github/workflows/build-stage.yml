# Lumo build stage (reusable workflow, Helium-style).
#
# One stage of the 15-stage Windows build. Mirrors
# imputnet/helium-windows (.github/workflows/build-stage.yml +
# .github/actions/stage/index.js), with the stage logic in
# scripts/ci/stage.py instead of a Node action:
#   * from_artifact=false (stage 1): start from an empty build root.
#   * from_artifact=true (stages 2-15): download the previous stage's
#     build-state artifact (named lumo-build-state-<prev stage>) and
#     extract it to C:\, then resume from the recorded phase. Before
#     downloading, the workflow frees disk with stage.py
#     --free-disk-only: run #17's build-5 died extracting its
#     checkpoint (7.7 GiB zip + 25.3 GiB tree) because stage.py's own
#     cleanup runs only after extraction.
#   * stage.py exits 0 when the build finishes, 42 when the time
#     budget expires (resume in the next stage), anything else on a
#     real failure.
#   * The build-state artifact is uploaded after every stage whose
#     stage step SUCCEEDED — stage.py exited 0 (finished) or 42
#     (budget expired) — named lumo-build-state-<this stage>, so the
#     next stage (or build-final, for the finishing stage) can
#     download the tree. Per-stage names avoid the "multiple
#     artifacts with the same name" problem of reusing one name.
#     On a real failure (any other exit code) the upload step is
#     skipped (the default success() condition): no checkpoint is
#     carried over, the stage chain stops, and a new workflow run
#     starts over from stage 1.
#   * The job timeout is 330 minutes; stage.py stops work after ~4h45m
#     so there is time left to zip and upload the checkpoint.
#
# Cross-run resume (2026-11-18): a stage may download its
# checkpoint from an earlier run via the run-id input; used once to
# resume run #18 at stage 5 from run #17's lumo-build-state-4.
#
# Ran end to end in run #12 (2026-11-15); see scripts/ci/stage.py.
name: Lumo build stage

on:
  workflow_call:
    inputs:
      stage:
        description: Stage number (1-15)
        required: true
        type: number
      from-artifact:
        description: Resume from the previous stage's build-state artifact
        required: true
        type: boolean
      artifact-name:
        description: Name of the previous stage's artifact to download (empty for stage 1)
        required: false
        type: string
        default: ""
      runner:
        description: Runner image name
        required: false
        type: string
        default: windows-2025
      run-id:
        description: 'Run id to download the checkpoint from (empty = current run; set only for a cross-run resume entry stage)'
        required: false
        type: string
        default: ""
    outputs:
      finished:
        description: "true when the build finished in this stage"
        value: ${{ jobs.build.outputs.finished }}
      stage:
        description: This stage's number
        value: ${{ jobs.build.outputs.stage }}

permissions:
  contents: read
  actions: read

env:
  BUILD_ROOT: C:/lumo-build
  BUILD_STATE_ZIP: build-state.zip
  # Pinned inputs. Thorium commit 382f9a88 is the main-branch commit
  # whose version.py declares THORIUM_VERSION = "156.0.8078.80".
  THORIUM_COMMIT: 382f9a882a4dce4e308f1aef71dad6f648e5a081
  CHROMIUM_TAG: 156.0.8078.80

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 330
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      stage: ${{ inputs.stage }}
    steps:
      - name: Record job start
        shell: pwsh
        run: '"LUMO_JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'

      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare Windows build environment
        shell: pwsh
        run: |
          # Long paths are required for Chromium checkouts on Windows.
          git config --global core.longpaths true
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7z is not available on this runner'
          }
          # Chromium 156 needs the Windows 11 SDK 10.0.28000.x
          # (Helium installs 10.0.28000.0 the same way). Verified in
          # practice by runs #11/#12 (2026-11-15), which completed
          # gn gen and the full compile with this SDK in place.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0\um\Windows.h")) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2370315' -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
            $installer = Start-Process "$env:RUNNER_TEMP\winsdksetup.exe" -ArgumentList '/quiet', '/norestart', '/features', '+' -Wait -PassThru
            if ($installer.ExitCode -notin @(0, 3010)) { throw "Windows SDK installation failed: $($installer.ExitCode)" }
          }

      - name: Free disk space before extraction
        # Run #17 died extracting build-5's checkpoint: the zip
        # (7.7 GiB) plus the expanded tree (25.3 GiB) did not fit
        # because the runner starts with only ~28 GiB free and
        # stage.py's own cleanup runs AFTER extraction. build-4's
        # extraction had already left only 3 GiB free; build-5's
        # slightly larger checkpoint tipped it over. Free the same
        # allowlisted toolchains first via stage.py --free-disk-only,
        # which reuses free_disk_space() exactly (no new paths are
        # ever deleted). Runs before Download so the download itself
        # also has room.
        if: inputs.from-artifact
        shell: bash
        run: |
          python scripts/ci/stage.py --free-disk-only \
            --build-root "$BUILD_ROOT"

      - name: Download previous build state
        if: inputs.from-artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build-state
          # Cross-run resume: the entry stage of a resumed run
          # downloads its checkpoint from the earlier run named by
          # run-id (e.g. run #17's lumo-build-state-4). Empty run-id
          # falls back to the current run, so the normal in-run
          # stage chain is unchanged.
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Extract previous build state
        if: inputs.from-artifact
        shell: pwsh
        run: |
          # Free-space gate: fail fast with numbers instead of dying
          # 16 minutes into extraction (run #17, build-5). Peak need
          # is the zip plus the expanded tree; state-4 was 7.7 GiB +
          # 25.3 GiB, so require zip + 30 GiB (the 30 GiB covers the
          # expanded tree with room for it to keep growing). This is
          # a tripwire, not a guarantee — the 7z x exit check below
          # remains the backstop if the tree outgrows the allowance.
          $zipPath = "build-state/${{ env.BUILD_STATE_ZIP }}"
          $zipGiB = (Get-Item $zipPath).Length / 1GB
          $freeGiB = (Get-PSDrive C).Free / 1GB
          Write-Host "Free disk before extraction: $([math]::Round($freeGiB, 1)) GiB; checkpoint zip: $([math]::Round($zipGiB, 1)) GiB"
          $needGiB = $zipGiB + 30
          if ($freeGiB -lt $needGiB) { throw "Not enough free disk to extract the checkpoint: $([math]::Round($freeGiB, 1)) GiB free, need $([math]::Round($needGiB, 1)) GiB (zip $([math]::Round($zipGiB, 1)) GiB + 30 GiB for the expanded tree). The pre-extraction cleanup did not free enough; rerun the stage." }
          # Integrity gate: nothing else verifies the checkpoint
          # hand-off between stages. `7z t` checks every entry's
          # CRC, so a checkpoint truncated or corrupted in upload,
          # storage, or download fails HERE, loudly, instead of
          # resuming a quietly incomplete tree (stage.py only
          # verifies the zip it wrote exists and is non-empty).
          # Exit 1 is a warning only — the same tolerance
          # checkpoint() applies when writing; exit >= 2 is fatal.
          7z t build-state/${{ env.BUILD_STATE_ZIP }}
          if ($LASTEXITCODE -ge 2) { throw "Checkpoint integrity check failed (7z t exit $LASTEXITCODE): build-state/${{ env.BUILD_STATE_ZIP }} is corrupt or truncated; refusing to resume from it." }
          if ($LASTEXITCODE -eq 1) { Write-Host 'WARNING: 7z t exited 1 (warnings only); continuing to extraction.' }
          7z x build-state/${{ env.BUILD_STATE_ZIP }} -oC:\ -y
          if ($LASTEXITCODE -ge 2) { throw "Checkpoint extraction failed (7z x exit $LASTEXITCODE); refusing to resume from a partially extracted tree." }
          # The downloaded zip is no longer needed once extracted;
          # deleting it frees ~7.7 GiB before the compile starts.
          # (stage.py writes its own fresh checkpoint zip to
          # $GITHUB_WORKSPACE/build-state.zip, a different path.)
          Remove-Item build-state -Recurse -Force

      - name: Run build stage
        id: stage
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: |
          set +e
          python scripts/ci/stage.py \
            --build-root "$BUILD_ROOT" \
            --repo-root "$GITHUB_WORKSPACE" \
            --state-zip "$GITHUB_WORKSPACE/${{ env.BUILD_STATE_ZIP }}" \
            --job-started-at "$LUMO_JOB_STARTED_AT" \
            --profile avx2 \
            --thorium-commit "$THORIUM_COMMIT" \
            --chromium-tag "$CHROMIUM_TAG"
          code=$?
          if [ "$code" -eq 0 ]; then echo "finished=true" >> "$GITHUB_OUTPUT";
          elif [ "$code" -eq 42 ]; then echo "finished=false" >> "$GITHUB_OUTPUT";
          else echo "finished=false" >> "$GITHUB_OUTPUT"; exit "$code"; fi

      - name: Upload build state for the next stage
        # Runs only when the stage step above succeeded (stage.py
        # exit 0 = finished, 42 = budget expired): this artifact is
        # what the next stage resumes from, and build-final downloads
        # the finishing stage's one to package the tree. On a real
        # failure this step is skipped and no state is uploaded.
        uses: actions/upload-artifact@v6
        with:
          name: lumo-build-state-${{ inputs.stage }}
          path: ${{ env.BUILD_STATE_ZIP }}
          retention-days: 3
